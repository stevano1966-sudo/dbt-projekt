# Dateiname: dbt_project.yml
# dbt_project.yml
# =========================================================================
# dbt & Snowflake Analytics Engineering
# Projekt: Multi-Project Pipeline
# Snowflake · dbt Cloud
# Ersteller: Milomir Stevanovic
# Datum: 06.10.2026
# Änderung: 06.10.2026 - +schema auf Projektebene entfernt, damit das Makro
#                        generate_schema_name über node.fqn auf
#                        BRONZE / SILVER / GOLD verteilen kann
# =========================================================================

# ---- Basis-Metadaten ----
# Name des Projekts (nur Kleinbuchstaben und Unterstriche)
name: 'my_new_project'
version: '1.0.0'
config-version: 2

# Profilname: muss mit dem Profil in dbt Cloud / profiles.yml übereinstimmen
profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# -------------------------------------------------------------------------
# Modell-Konfiguration
# Wichtig: KEIN +schema setzen. Dann ist custom_schema_name im Makro leer und
# die Zuordnung erfolgt über den Ordnernamen:
#   staging      -> BRONZE (DEV_BRONZE / PROD_BRONZE)
#   intermediate -> SILVER (DEV_SILVER / PROD_SILVER)
#   marts        -> GOLD   (DEV_GOLD   / PROD_GOLD)
# Die Ordnernamen unter models/ müssen exakt so heißen.
# -------------------------------------------------------------------------
models:
  my_new_project:           # Muss exakt dem 'name:' oben entsprechen!

    # --------------------------------------------------------------------------
    # Silver Screen
    # Ordnerpfad: models/silver_screen/
    # Ziel-Schema in der Datenbank: <profile_schema>_silver_screen
    # --------------------------------------------------------------------------
    silver_screen:          # Entspricht models/silver_screen/
      staging:
        +schema: bronze     # Weist das Schema bronze zu
        +materialized: view # Materialisiert das Modell als View
      intermediate:
        +schema: silver     # Weist das Schema silver zu
        +materialized: view # Materialisiert das Modell als View
      marts:
        +schema: gold       # Weist das Schema gold zu
        +materialized: table # Materialisiert das Modell als Tabelle

    # --------------------------------------------------------------------------
    # Tasty Bytes
    # Ordnerpfad: models/tasty_bytes/
    # Ziel-Schema in der Datenbank: <profile_schema>_tasty_bytes
    # --------------------------------------------------------------------------
    tasty_bytes:
      +database: TASTY_BYTES_SAMPLE_DATA # Überschreibt die Standard-Datenbank für tasty_bytes
      staging:
        +schema: bronze     # Weist das Schema bronze zu
        +materialized: view # Materialisiert das Modell als View
      marts:
        +schema: gold       # Weist das Schema gold zu
        +materialized: table # Materialisiert das Modell als Tabelle

    # --------------------------------------------------------------------------
    # Lesson DB
    # Ordnerpfad: models/lesson_db/
    # Ziel-Schema in der Datenbank: <profile_schema>_lesson_db
    # --------------------------------------------------------------------------
    lesson_db:
      +database: LESSON_DB     # Überschreibt die Standard-Datenbank für lesson_db
      staging:
        +schema: bronze     # Weist das Schema bronze zu
        +materialized: view # Materialisiert das Modell als View
      intermediate:
        +schema: silver     # Weist das Schema silver zu
        +materialized: view # Materialisiert das Modell als View
      marts:
        +schema: gold       # Weist das Schema gold zu
        +materialized: table # Materialisiert das Modell als Tabelle

    # --------------------------------------------------------------------------
    # Powerflow
    # Ordnerpfad: models/powerflow/
    # Ziel-Schema in der Datenbank: <profile_schema>_powerflow
    # --------------------------------------------------------------------------
    powerflow:
      +database: POWERFLOW     # Überschreibt die Standard-Datenbank für powerflow
      staging:
        +schema: bronze     # Weist das Schema bronze zu
        +materialized: view # Materialisiert das Modell als View
      intermediate:
        +schema: silver     # Weist das Schema silver zu
        +materialized: view # Materialisiert das Modell als View
      marts:
        +schema: gold       # Weist das Schema gold zu
        +materialized: table # Materialisiert das Modell als Tabelle
        
        
seeds:
  my_new_project:           # Muss ebenfalls exakt dem 'name:' oben entsprechen!
    powerflow:
      +database: POWERFLOW     # Weist die Datenbank POWERFLOW für den Seed zu
      +schema: bronze          # Weist das Schema bronze für den Seed zu